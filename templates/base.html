<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jenkins Monitor{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body
    data-pipeline-name="{{ pipeline_name }}"
    data-branch-name="{{ branch_name }}"
    data-can-manage-builds="{{ 'true' if has_role('admin', 'developer') else 'false' }}"
    data-can-export-pdf="{{ 'true' if has_role('admin') else 'false' }}"
    data-export-report-url="{{ url_for('overview.export_pdf_report_api') }}"
    data-store-export-report-url="{{ url_for('overview.store_exported_pdf_report_api') }}"
    data-system-time-zone="{{ system_time_zone }}"
    {% block body_attrs %}{% endblock %}>

    {% include 'partials/sidebar.html' %}

    <main class="main">
        {% include 'partials/navbar.html' %}

        <div class="page">
            {% block page_content %}{% endblock %}
        </div>
    </main>

    <div id="toast" class="toast"></div>
    {% include 'partials/chat_panel.html' %}

    {% block extra_markup %}{% endblock %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/base.js', v='20260523-sse3') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
