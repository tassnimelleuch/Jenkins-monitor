<header class="topbar">
    <div class="pipe-icon">⚙</div>

    <div>
        <div class="pipe-name">{{ pipeline_name }}</div>
        <div class="pipe-meta">
            Branch:&nbsp;<span class="branch-tag">{{ branch_name }}</span>&nbsp;·&nbsp;Build&nbsp;<span class="build-tag" id="latestBuildTag">#—</span>
        </div>
    </div>

    <div class="topbar-actions">
        {% block topbar_actions %}
        {% if has_role('admin', 'developer') %}
        <button class="btn btn-green" id="startStopBtn" type="button" onclick="toggleBuild()">▶ Start Build</button>
        {% endif %}
        {% if has_role('admin') %}
        <button class="btn btn-export" id="exportPdfBtn" type="button" onclick="exportPDF()">↓ Export PDF</button>
        {% endif %}
        {% endblock %}

    </div>

</header>
